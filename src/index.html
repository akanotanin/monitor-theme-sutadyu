<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#efd3a4" />
<meta name="theme-version" content="dev" />
<!-- 上面这行只是占位：`node tools/build.mjs` 会按 theme.json 的 version 改写它（dist/ 里是真版本号）。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23efd3a4'/%3E%3Crect x='5' y='13' width='22' height='12' fill='%23d98478'/%3E%3Crect x='8' y='17' width='5' height='6' fill='%23fff6dc'/%3E%3Crect x='19' y='17' width='5' height='6' fill='%23fff6dc'/%3E%3Crect x='4' y='8' width='24' height='6' fill='%23b85f49'/%3E%3Crect x='14' y='19' width='4' height='6' fill='%237b5b3e'/%3E%3C/svg%3E" />
<title>Monitor</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    --ink: #503a2d;
    --cream: #fff6dc;
    --paper: rgba(255, 248, 222, 0.94);
    --line: rgba(111, 76, 47, 0.3);
    --leaf: #598553;
    --orange: #ce7746;
  }

  * { box-sizing: border-box; }

  html, body, #game {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
  }

  body {
    background: #efd3a4;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }

  #scene {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%; outline: none; cursor: default;
  }

  /* ---------------- 左上角信息牌 ---------------- */
  .hud {
    position: absolute;
    top: clamp(14px, 2.6vw, 30px);
    left: clamp(14px, 2.6vw, 30px);
    z-index: 3;
    min-width: 208px;
    padding: 13px 16px 12px;
    border: 1px solid rgba(255, 255, 255, 0.62);
    border-radius: 7px;
    background: linear-gradient(135deg, rgba(255, 250, 230, 0.92), rgba(255, 242, 214, 0.88));
    box-shadow: 0 6px 18px rgba(96, 66, 38, 0.16);
    backdrop-filter: blur(4px);
    transition: opacity 0.4s ease;
  }
  .hud h1 {
    margin: 0 0 9px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #5d4433;
    display: flex; align-items: center; gap: 8px;
  }
  .hud h1::before {
    content: ""; width: 9px; height: 9px; background: var(--leaf);
    transform: rotate(45deg); border-radius: 1px;
  }
  .hud .hud-site { margin: -4px 0 8px; font-size: 11px; letter-spacing: 0.06em; color: #7d6749; }
  .hud .row {
    display: flex; align-items: center; gap: 7px;
    margin-top: 6px; font-size: 12.5px; color: #6d5644; letter-spacing: 0.02em;
  }
  /* 触屏档专用的一行说明：桌面（鼠标）不显示，body.touch 才替换掉键位提示 */
  .hud .row-touch { display: none; }
  .hud .row-touch .tk {
    display: inline-block; padding: 1px 7px;
    font-size: 11px; font-weight: 700; color: #6b5442;
    background: rgba(255, 253, 244, 0.9);
    border: 1px solid rgba(120, 88, 56, 0.3); border-radius: 4px; line-height: 15px;
  }
  .hud kbd {
    display: inline-block; min-width: 20px; padding: 1px 6px;
    font-family: inherit; font-size: 11px; font-weight: 700; color: #6b5442;
    background: linear-gradient(#fffdf4, #f3e6c9);
    border: 1px solid rgba(120, 88, 56, 0.34);
    border-bottom-width: 2px; border-radius: 4px; text-align: center; line-height: 15px;
  }
  .hud .dim { color: #7d6749; font-size: 11.5px; letter-spacing: 0.08em; }


  /* ---------------- 探针：右上角概况 ---------------- */
  .probe-bar {
    position: absolute;
    top: clamp(14px, 2.6vw, 30px);
    right: clamp(14px, 2.6vw, 30px);
    z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    font-size: 12px; letter-spacing: 0.06em; color: #6b5442;
    background: linear-gradient(135deg, rgba(255, 250, 230, 0.92), rgba(255, 242, 214, 0.86));
    border: 1px solid rgba(255, 255, 255, 0.62);
    border-radius: 7px;
    box-shadow: 0 6px 18px rgba(96, 66, 38, 0.14);
    backdrop-filter: blur(4px);
  }
  .probe-bar::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #9d9d92; box-shadow: 0 0 0 3px rgba(157, 157, 146, 0.18);
  }
  .probe-bar[data-state="ok"]::before { background: #5aa860; box-shadow: 0 0 0 3px rgba(90, 168, 96, 0.2); }
  .probe-bar[data-state="warn"]::before { background: #c9902f; box-shadow: 0 0 0 3px rgba(201, 144, 47, 0.2); }
  .probe-bar[data-state="locked"]::before { background: #b98a4e; box-shadow: 0 0 0 3px rgba(185, 138, 78, 0.22); }
  .probe-bar[data-state="locked"] .probe-status { color: #8a5f33; }
  .probe-bar .probe-status { font-weight: 700; color: #5d4433; }
  .probe-bar .probe-time { color: #7d6749; font-size: 11px; }

  /* ---------------- 探针列表 / 详情（统一悬浮表口径） ---------------- */
  #plist {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    background: rgba(60, 44, 30, 0.32);
    backdrop-filter: blur(7px);
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s;
  }
  #plist.show { opacity: 1; visibility: visible; }
  #plist .sheet {
    width: min(1180px, calc(100vw - 36px));
    max-height: min(84vh, 860px);
    display: flex; flex-direction: column;
    min-height: 0;
    background: linear-gradient(180deg, rgba(255, 251, 241, 0.99), rgba(249, 240, 222, 0.99));
    border: 1px solid rgba(120, 88, 56, 0.26);
    border-radius: 14px;
    box-shadow: 0 30px 90px rgba(64, 44, 26, 0.36);
    transform: translateY(10px) scale(0.99);
    transition: transform 0.22s ease;
    overflow: hidden;
  }
  #plist.show .sheet { transform: translateY(0) scale(1); }
  /* 详情态：用更高的 sheet，图表才有地方站 */
  #plist.is-detail .sheet { max-height: min(92vh, 980px); }
  /* 只藏「sheet 页脚那行按键说明」。这里是直接子选择器：
     写成 `#plist.is-detail .note` 会连 #dcharts 里的状态提示（正在读 / 读取失败 /
     没有 ping 任务）一起藏掉——那三条提示的特异性比 `#dcharts .note` 高，
     详情页每次打开都是空白，连「读取超时」都看不见。 */
  #plist.is-detail > .sheet > .note { display: none; }

  #plist header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 13px;
    border-bottom: 1px solid rgba(120, 88, 56, 0.14);
  }
  #plist header h3 {
    margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.1em; color: #4a3527;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #plist-sum { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: #7d6749; letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #plist-sum b { color: #4a3527; font-weight: 700; }
  #plist-back, #plist-close {
    width: 30px; height: 30px; padding: 0;
    font: inherit; font-size: 16px; line-height: 1; color: #7d6749;
    background: transparent; border: 0; border-radius: 7px; cursor: pointer;
  }
  /* 触屏档：面板开着时把摇杆/动作键收起来（它们盖在详情页下层，会挡到九格与图表），
     同时把返回/关闭抬到真机触控目标下限（30 → 44）。 */
  body.touch #plist-back, body.touch #plist-close { width: 44px; height: 44px; font-size: 17px; flex: 0 0 auto; }
  body.touch #plist-back { margin-left: -12px; }
  body.touch.panel-open #touch { opacity: 0; visibility: hidden; pointer-events: none; }

  #plist-back { margin-left: -6px; }
  #plist-close { flex: 0 0 auto; }
  #plist-back:hover, #plist-close:hover { background: rgba(120, 88, 56, 0.1); color: #4a3527; }
  /* 管理后台入口（只在面板里出现） */
  #plist-admin {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #6b5442;
    text-decoration: none; white-space: nowrap;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(120, 88, 56, 0.24);
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  #plist-admin:hover { background: rgba(160, 190, 140, 0.3); border-color: rgba(120, 150, 100, 0.5); color: #4a3527; }
  #plist .hidden { display: none !important; }

  /* ---- 卡片网格：三列布局 ---- */
  #plist-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px;
    display: grid;
    /* ★恒定 3 列。原来用 auto-fill minmax(330px,1fr)，宽屏上会自己变成 4 列，
       卡片宽度忽宽忽窄、列表的节奏也跟着变。 */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-content: start;
  }
  .pp-card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px;
    font: inherit; text-align: left; color: #44342a;
    background: linear-gradient(180deg, rgba(255, 252, 244, 0.96), rgba(252, 245, 232, 0.96));
    border: 1px solid rgba(120, 88, 56, 0.18);
    border-radius: 11px;
    box-shadow: 0 2px 8px rgba(96, 66, 38, 0.06);
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
  }
  .pp-card:hover {
    border-color: rgba(120, 88, 56, 0.4);
    box-shadow: 0 8px 22px rgba(96, 66, 38, 0.13);
    transform: translateY(-1px);
  }
  .pp-card.is-off { opacity: 0.66; }

  .pc-head { display: flex; align-items: center; gap: 8px; }
  /* 国旗：20×14，本地包内自带，不请求第三方 */
  .pc-fl {
    width: 20px; height: 14px;
    border-radius: 2px; flex: 0 0 auto;
    object-fit: cover;
    background: rgba(120, 88, 56, 0.12);
  }
  /* 没有 country 时的兜底：不显示破图，给一枚小地球。
     ★盒子必须和 <img> 一样大（20×14）：否则「有国旗」和「无国旗」的卡片
       名字左边缘会错开约 2px，三列并排时一眼看出来。 */
  .pc-fl.emoji {
    width: 20px; height: 14px; background: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; color: #a08a6c;
  }
  .pc-name {
    flex: 1 1 auto; min-width: 0;
    font-size: 14.5px; font-weight: 800; letter-spacing: 0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pc-badge {
    flex: 0 0 auto;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    color: color-mix(in srgb, var(--c) 38%, #38271a);
    background: color-mix(in srgb, var(--c) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
  }
  .pc-spec { font-size: 11.5px; color: #7d6749; letter-spacing: 0.02em; }

  .pc-bars { display: grid; gap: 6px; }
  .pc-bar { display: grid; grid-template-columns: 34px 1fr 38px; align-items: center; gap: 9px; }
  .pc-bar .k { font-size: 11px; color: #7d6749; letter-spacing: 0.02em; }
  .pc-bar .track { height: 5px; border-radius: 99px; background: rgba(120, 88, 56, 0.14); overflow: hidden; }
  .pc-bar .fill { display: block; height: 100%; border-radius: 99px; background: #7aa86a; transition: width 0.4s ease; }
  .pc-bar .fill.warm { background: #d9a740; }
  .pc-bar .fill.hot { background: #d1665c; }
  .pc-bar .v { font-size: 11.5px; font-weight: 700; text-align: right; color: #5d432f; }

  .pc-net {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px;
    padding-top: 3px;
    font-size: 11px; color: #6b5442; letter-spacing: 0.01em;
  }
  /* ★不能省 flex-wrap：卡宽在 3 列档会掉到 ~265px，而「↓ 1220.7 MB/s ↑ 1220.7 MB/s」
     加「↓ 9.0 TB ↑ 9.0 TB」两段 nowrap 文本的净宽正好也约 241px（实测余量 0）——
     数值多一位就硬溢出卡片。换行比挤爆安全。 */
  .pc-net span { white-space: nowrap; min-width: 0; }

  .pc-carriers {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    padding-top: 6px; margin-top: 1px;
    border-top: 1px dashed rgba(120, 88, 56, 0.18);
    font-size: 11px; color: #6b5442;
  }
  .pc-carrier { display: inline-flex; align-items: baseline; gap: 5px; }
  .pc-carrier b { font-weight: 600; color: #7d6749; }
  .pc-carrier .lat { font-weight: 700; color: #4a3527; }
  .pc-carrier .loss { font-size: 10.5px; }
  .pc-carrier .loss.ok { color: #3d7439; }
  .pc-carrier .loss.warn { color: #8a5f12; }
  .pc-carrier .loss.bad { color: #b23d33; }
  .pc-carrier.dim { color: #7d6749; }

  /* 公开备注（卡片尾行；hub 里没填备注就不出现） */
  .pc-pre {
    padding-top: 6px; margin-top: 1px;
    border-top: 1px dashed rgba(120, 88, 56, 0.18);
    font-size: 11px; color: #7d6749; letter-spacing: 0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #plist .note {
    margin: 0; padding: 9px 20px 11px;
    font-size: 10.5px; color: #7d6749; letter-spacing: 0.05em;
    border-top: 1px solid rgba(120, 88, 56, 0.14);
  }
  #plist .note kbd {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin: 0 2px;
    font: inherit; font-size: 10px; font-weight: 700; color: #6b5442;
    background: linear-gradient(#fffdf4, #f3e6c9);
    border: 1px solid rgba(120, 88, 56, 0.3); border-bottom-width: 2px; border-radius: 4px;
  }
  /* 页脚提示按输入方式换说法：手机上写「Tab / Esc」是纯噪音（没有这两个键） */
  #plist .note-touch { display: none; }
  body.touch #plist .note-kb { display: none; }
  body.touch #plist .note-touch { display: inline; }

  /* ---- 详情页：九格信息 + 页签 + 时间范围 + 折线图 ---- */
  #plist-detail {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  #plist-detail > * { flex: 0 0 auto; }

  /* ---- 悬浮层里的滚动条：跟纸面浮窗同一套配色（列表/详情共用）----
     透明轨道 + 淡墨圆头滑块（10px 条、内缩 3px → 视觉约 4px），悬停加深、无箭头。
     ★ 标准属性只能在 Firefox 里给：Chromium 一旦看到 scrollbar-width 就退回原生细条（箭头还在）。 */
  #plist-body::-webkit-scrollbar, #plist-detail::-webkit-scrollbar { width: 10px; height: 10px; }
  #plist-body::-webkit-scrollbar-track, #plist-detail::-webkit-scrollbar-track { background: transparent; }
  #plist-body::-webkit-scrollbar-thumb, #plist-detail::-webkit-scrollbar-thumb {
    background: rgba(120, 88, 56, 0.35); border-radius: 999px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  #plist-body::-webkit-scrollbar-thumb:hover, #plist-detail::-webkit-scrollbar-thumb:hover {
    background: rgba(120, 88, 56, 0.55); background-clip: padding-box;
  }
  #plist-body::-webkit-scrollbar-corner, #plist-detail::-webkit-scrollbar-corner { background: transparent; }
  #plist-body::-webkit-scrollbar-button, #plist-detail::-webkit-scrollbar-button { display: none; }
  #plist-body, #plist-detail { scrollbar-gutter: stable; }
  @supports (-moz-appearance: none) {   /* 仅 Firefox 生效 */
    #plist-body, #plist-detail { scrollbar-width: thin; scrollbar-color: rgba(120, 88, 56, 0.45) transparent; }
  }
  .pd-state { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; }

  /* 九格信息格：无框留白（10px 18px 间距），
     不用「1px 间隙 + 底色」拼出的细分隔线表格——那样会把九格读成一张表。 */
  .pgrid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 18px;
    margin: 0;
  }
  .pgrid .cell {
    padding: 0;
    background: none;
    min-width: 0;
  }
  .pgrid dt {
    font-size: 11.5px; letter-spacing: 0.04em; color: #7d6749;
    margin-bottom: 1px;
  }
  .pgrid dd {
    margin: 0; font-size: 13px; font-weight: 700; color: #44342a;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 页签 */
  .tabs { display: flex; gap: 6px; }
  .tabs .tab {
    padding: 5px 14px;
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    color: #7d6749; background: transparent;
    border: 1px solid rgba(120, 88, 56, 0.22);
    border-radius: 7px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tabs .tab:hover { background: rgba(255, 253, 246, 0.8); border-color: rgba(120, 88, 56, 0.36); }
  .tabs .tab.on {
    color: #fffaf0; background: #4a7040; border-color: #3f6034;
  }

  /* 时间范围 */
  .rangebar { display: flex; flex-wrap: wrap; gap: 4px; }
  .rangebar .rbtn {
    padding: 3px 10px;
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    color: #7d6749; background: rgba(255, 253, 246, 0.6);
    border: 1px solid rgba(120, 88, 56, 0.18);
    border-radius: 999px; cursor: pointer;
  }
  .rangebar .rbtn:hover { border-color: rgba(120, 88, 56, 0.34); }
  .rangebar .rbtn.on { color: #4a3527; background: rgba(160, 190, 140, 0.34); border-color: rgba(120, 150, 100, 0.5); }

  /* 图表网格：两列三排 */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .cpanel {
    position: relative;
    padding: 7px 10px 4px;
    background: rgba(255, 253, 246, 0.86);
    border: 1px solid rgba(120, 88, 56, 0.14);
    border-radius: 9px;
    min-width: 0;
  }
  .cpanel h5 {
    margin: 0 0 2px;
    display: flex; align-items: baseline; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #6b5442;
  }
  .cpanel h5 .cl { margin-left: auto; display: flex; gap: 9px; font-size: 10px; font-weight: 600; color: #7d6749; }
  .cpanel h5 .cl i { display: inline-block; width: 7px; height: 3px; margin-right: 4px; border-radius: 2px; vertical-align: middle; }
  .cpanel canvas { display: block; width: 100%; height: auto; cursor: crosshair; }

  /* 图表浮框 */
  .chart-tip {
    position: absolute; z-index: 5;
    padding: 6px 9px;
    display: grid; gap: 2px;
    font-size: 10.5px; line-height: 1.35; color: #4a3527;
    background: rgba(255, 252, 244, 0.98);
    border: 1px solid rgba(120, 88, 56, 0.3);
    border-radius: 7px;
    box-shadow: 0 6px 18px rgba(80, 56, 32, 0.2);
    pointer-events: none;
    white-space: nowrap;
  }
  .chart-tip b { font-weight: 700; color: #6b5442; }
  .chart-tip span { display: flex; align-items: center; gap: 5px; }
  .chart-tip i { display: inline-block; width: 7px; height: 3px; border-radius: 2px; }
  /* hidden 属性必须真的隐藏：.chart-tip 的 display:grid 会盖掉 UA 的 [hidden]{display:none}，
     否则没悬停时页面上会多出一个空的小胶囊（审查实测） */
  .chart-tip[hidden] { display: none !important; }

  /* 延迟页图例 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 2px 2px 0; }
  .chips .chip { font-size: 11px; color: #6b5442; }
  .chips .chip b { margin-right: 3px; font-size: 10px; }

  /* 空态/未开放态横跨整行：它是 #plist-body 的网格子项，
     恒定 3 列时只占第 1 列（约 1/3 宽），文案会在窄框里折行、看着像排版崩了。 */
  #plist-body > .pd-empty { grid-column: 1 / -1; }
  .pd-empty { padding: 26px 8px; text-align: center; font-size: 12px; color: #7d6749; }
  #dcharts .note { display: block; margin: 0; padding: 14px 2px; border-top: 0; font-size: 12px; color: #7d6749; }

  /* 顶栏的列表按钮 */
  .probe-bar .pp-open,
  .probe-bar .pp-cards {
    pointer-events: auto;
    margin-left: 2px; padding: 2px 8px;
    font: inherit; font-size: 11px; font-weight: 700; color: #6b5442;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(120, 88, 56, 0.24); border-radius: 6px; cursor: pointer;
  }
  .probe-bar .pp-open:hover,
  .probe-bar .pp-cards:hover { background: #fffdf6; }
  /* 「卡片」开关处于关闭态：变淡 + 划掉，一眼看出当前没在显示 */
  .probe-bar .pp-cards[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }

  /* ---------------- 触屏操作：左下摇杆 + 右下动作键 ----------------
     只在 pointer: coarse / 无悬停的设备上由 main.js 取消 hidden（body.touch）。
     纸面配色跟小镇一致：奶油底盘 + 木色描边，不用深色玻璃。 */
  #touch { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  /* ---- 小地图 ----
     放在右上、状态条下方：摇杆在左下、动作键在右下，只有这块空地。
     纸面配色跟小镇一致，不用深色玻璃。 */
  #minimap {
    position: absolute; right: clamp(12px, 3vw, 20px); top: calc(84px + env(safe-area-inset-top));
    width: 104px; height: 104px; padding: 5px;
    border-radius: 12px;
    background: rgba(255, 250, 236, 0.82);
    border: 2px solid rgba(120, 88, 56, 0.42);
    box-shadow: 0 3px 10px rgba(90, 62, 38, 0.18);
    pointer-events: auto; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #minimap:active { transform: scale(0.97); }
  #minimap canvas { display: block; width: 100%; height: 100%; border-radius: 8px; }
  #minimap .mm-hint {
    position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%);
    font-size: 10px; color: #7d6749; white-space: nowrap;
    background: rgba(255, 250, 236, 0.9); padding: 1px 6px; border-radius: 6px;
  }
  /* 面板打开时收掉（面板是整屏浮层） */
  body.panel-open #minimap { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 桌面不显示：视野本来就够，小地图只是噪点 */
  body:not(.touch) #minimap { display: none; }
  #stick {
    position: absolute; left: clamp(14px, 4vw, 26px); bottom: calc(20px + env(safe-area-inset-bottom));
    width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(255, 250, 236, 0.62), rgba(255, 244, 222, 0.4));
    border: 1px solid rgba(120, 88, 56, 0.36);
    box-shadow: 0 8px 22px rgba(96, 66, 38, 0.2), inset 0 0 0 6px rgba(255, 255, 255, 0.26);
    backdrop-filter: blur(3px);
    pointer-events: auto; touch-action: none;
  }
  #stick::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 62%; height: 62%; margin: -31% 0 0 -31%;
    border-radius: 50%; border: 1px dashed rgba(120, 88, 56, 0.22);
  }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: linear-gradient(180deg, #fffdf4, #f2e3c4);
    border: 1px solid rgba(120, 88, 56, 0.44);
    box-shadow: 0 4px 10px rgba(96, 66, 38, 0.26), inset 0 -2px 0 rgba(150, 100, 50, 0.18);
    transition: transform 0.07s ease-out;
  }
  #stick.drag #stick-knob { transition: none; }
  #tbtns {
    position: absolute; right: clamp(14px, 4vw, 26px); bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end;
  }
  #t-act {
    width: 86px; height: 86px; padding: 0;
    display: grid; place-items: center;
    font: inherit; color: #6d5644;
    background: linear-gradient(180deg, rgba(255, 252, 244, 0.92), rgba(246, 232, 203, 0.92));
    border: 1px solid rgba(120, 88, 56, 0.4);
    border-radius: 50%;
    box-shadow: 0 8px 20px rgba(96, 66, 38, 0.2), inset 0 -3px 0 rgba(150, 100, 50, 0.16);
    pointer-events: auto; touch-action: none;
    opacity: 0.58;
    transition: opacity 0.16s ease, transform 0.12s ease, background 0.16s ease;
  }
  /* 附近能互动时点亮（不是灰按钮，一眼知道现在按了有用） */
  #t-act.on {
    opacity: 1; color: #4a3524;
    background: linear-gradient(180deg, #ffe9ac, #f3cf7d);
    border-color: rgba(120, 84, 44, 0.52);
  }
  #t-act:active { transform: scale(0.94); }
  #t-act .t-lab { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; }

  /* 触屏文案：键位提示对触屏访客是噪音（手机上还会和顶栏撞在一起），统一换成触屏说法 */
  body.touch .hud .row:not(.row-touch) { display: none; }
  body.touch .hud .row-touch { display: flex; }
  /* 窄屏触屏（手机竖屏）：HUD 只留主题名、状态条去掉更新时间，两者并排一行。
     收窄后 HUD 94px + 状态条 185px 在 390px 里放得下（原来 HUD 全宽 + 8 个键帽
     会与状态条重叠 1248px²）；宽屏触屏（平板）仍走桌面版式。 */
  @media (max-width: 700px) {
    body.touch .hud {
      min-width: 0; padding: 0 10px;
      height: 34px;
      display: flex; align-items: center;
      border-radius: 6px;
    }
    body.touch .hud h1 { margin: 0; font-size: 12.5px; letter-spacing: 0.1em; }
    body.touch .hud h1::before { width: 7px; height: 7px; }
    body.touch .hud .hud-site { display: none; }
    /* 手机竖屏连触屏说明也收掉：一行说明会把 HUD 顶高，而摇杆 + 动作键自带说明
       （宽屏触屏才显示那行） */
    body.touch .hud .row-touch { display: none; }
    body.touch .probe-bar {
      height: 34px;
      padding: 0 8px;
      font-size: 11.5px;
      gap: 6px;
    }
    body.touch .probe-bar .probe-time { display: none; }
    /* 触屏档按钮要够点：桌面 21px 的行高在手指上太细，抬到 30px（≈44px 触控目标的
       内边距口径，靠 padding 撑，不改变顶栏高度太多） */
    body.touch .probe-bar .pp-open,
    body.touch .probe-bar .pp-cards {
      display: inline-flex; align-items: center;
      padding: 5px 9px; font-size: 11.5px; line-height: 1.2;
      min-height: 30px;
    }
  }
  body.touch #prompt .key { display: none; }
  body.touch #prompt { padding: 6px 13px; }
  /* 摇杆/动作键占住两个下角：对话与 toast 抬到它们上面 */
  body.touch #dialogue { bottom: calc(150px + env(safe-area-inset-bottom)); }
  body.touch #toast { bottom: calc(206px + env(safe-area-inset-bottom)); }
  @media (max-height: 430px) {
    #stick { width: 92px; height: 92px; }
    #stick-knob { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
    #t-act { width: 70px; height: 70px; }
    #t-act .t-lab { font-size: 13px; }
    body.touch #dialogue { bottom: calc(118px + env(safe-area-inset-bottom)); }
    body.touch #toast { bottom: calc(170px + env(safe-area-inset-bottom)); }
  }

  /* ---------------- 靠近物件时的按键提示 ---------------- */
  #prompt {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 13px 6px 7px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(96, 66, 38, 0.2);
    font-size: 13px; font-weight: 700; color: #5b432f;
    white-space: nowrap;
    /* 提示条只是标签：它浮在小鸡上方，吃掉 pointer-events 会让「点小鸡」点不中 */
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.92);
    transform-origin: center;
    transition: opacity 0.16s ease, transform 0.16s ease;
    will-change: left, top;
  }
  #prompt.show { transform: translate(-50%, -50%) scale(1); }
  #prompt .key {
    display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: 5px;
    font-size: 12px; font-weight: 800; color: #4a3524;
    background: linear-gradient(#ffe9ac, #f3cf7d);
    border: 1px solid rgba(120, 84, 44, 0.4);
    box-shadow: inset 0 -2px 0 rgba(150, 100, 50, 0.25);
  }

  /* ---------------- 底部对话 ---------------- */
  #dialogue {
    position: absolute; left: 50%; bottom: clamp(22px, 4vh, 40px);
    transform: translate(-50%, 12px);
    width: min(620px, calc(100vw - 48px));
    padding: 15px 20px 17px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: 0 12px 34px rgba(96, 66, 38, 0.22);
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  #dialogue.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  #speaker {
    display: inline-flex; align-items: center; gap: 7px;
    margin-bottom: 6px;
    font-size: 12.5px; font-weight: 800; letter-spacing: 0.1em; color: var(--orange);
  }
  #speaker::before {
    content: ""; width: 6px; height: 6px; border-radius: 1px;
    background: var(--orange); transform: rotate(45deg);
  }
  #dialogue-text { font-size: 15px; line-height: 1.7; color: #4b3a2c; letter-spacing: 0.02em; }
  #dialogue .tip {
    position: absolute; right: 16px; bottom: 9px;
    font-size: 10.5px; color: #7d6749; letter-spacing: 0.08em;
  }

  /* ---------------- 即时反馈 ---------------- */
  #toast {
    position: absolute; left: 50%; bottom: clamp(100px, 15vh, 140px);
    transform: translate(-50%, 8px);
    padding: 8px 16px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.03em; color: #5a4127;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(96, 66, 38, 0.16);
    opacity: 0; visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  /* ---------------- 告示牌 ---------------- */
  #notice {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -47%) scale(0.97);
    width: min(470px, calc(100vw - 56px));
    padding: 22px 26px 18px;
    background: linear-gradient(180deg, #fff9ea, #f6ead2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 22px 60px rgba(88, 58, 32, 0.28);
    opacity: 0; visibility: hidden;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
  }
  #notice.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
  #notice h2 {
    margin: 0 0 12px; font-size: 16px; letter-spacing: 0.16em; color: #6a4b31;
    text-align: center; font-weight: 800;
  }
  #notice h2::after {
    content: ""; display: block; width: 44px; height: 2px; margin: 10px auto 0;
    background: linear-gradient(90deg, transparent, rgba(190, 130, 80, 0.5), transparent);
  }
  #notice .body p { margin: 7px 0; font-size: 13.5px; line-height: 1.85; color: #5c4632; }
  #notice .close { margin-top: 12px; text-align: center; font-size: 11px; color: #7d6749; letter-spacing: 0.08em; }

  /* ---------------- 载入 ---------------- */
  /* 入场：奶油色幕布上的一颗像素胶囊 —— 小鸡把木料搬过去，房子跟着进度一段段长起来，
     100% 时开窗点灯、撒花，幕布才揭。画在 src/loading.js（216×128 整数网格）。 */
  #loading {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    background: #f0dcb8;
    pointer-events: auto;          /* 载入中吞掉点击，别让访客点到幕布后面的 3D 场景 */
    transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity;
  }
  /* ★这层曾经是 `radial-gradient(rgba(255,250,236,.9), transparent 70%)`——
     一层 90% 的近白色蒙在整个像素画上，把颜色全洗淡了（访客原话「半透明」）。
     像素画要的就是实色。现在只在四角留一圈很轻的暖色暗角，中心完全不遮。 */
  #loading::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(130% 120% at 50% 45%, rgba(240, 220, 184, 0) 55%, rgba(214, 186, 146, 0.28) 100%);
    pointer-events: none;
  }
  .ld-stage {
    position: relative; display: grid; justify-items: center; gap: 12px;
    padding: 8px;
  }
  #ld-canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: auto;
    cursor: default;
    touch-action: manipulation;
  }
  .ld-tip {
    margin: 0; font-size: 11.5px; letter-spacing: 0.22em; color: #7d6749;
    opacity: 0; transform: translateY(2px);
    transition: opacity 0.5s ease 0.15s, transform 0.5s ease 0.15s;
  }
  body.ld-ready .ld-tip { opacity: 0.9; transform: none; }
  @media (max-height: 430px) { .ld-tip { display: none; } }
  /* ★幕布淡出时必须立刻放行点击。
     只写 opacity:0 的话它仍然是 pointer-events:auto 的全屏 fixed 层，
     而 boot.js 要 1.2 秒后才 remove()——小镇刚出现的那一秒多里，
     点小鸡、点声音按钮全都被这层看不见的膜吞掉（实测验收就是这么挂的）。 */
  #loading.done { opacity: 0; pointer-events: none; }
  /* 世界淡入：首帧先压暗一点点，再回到正常，避免「啪」地出现 */
  #scene { opacity: 0; transition: opacity 1.1s ease-out; }
  body.world-ready #scene { opacity: 1; }
  .hud, .probe-bar { opacity: 0; transition: opacity 0.7s ease 0.35s; }
  body.world-ready .hud,
  body.world-ready .probe-bar { opacity: 1; }

  /* ---- 明信片模式（P 键 / 手机上点一下标题）----
     收起所有 UI 与卡片，只留小镇本身；用来截图或给别人看。
     再按一次 P 回来。 */
  body.postcard .hud,
  body.postcard .probe-bar,
  body.postcard #touch,
  body.postcard #prompt,
  body.postcard #toast,
  body.postcard #dialogue { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  body.postcard #scene { cursor: none; }
  /* 明信片模式下给一句很淡的提示，几秒后自己消失 */
  #postcard-hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 60; padding: 6px 14px; border-radius: 999px;
    background: rgba(40, 32, 24, 0.55); color: #f6ecd8;
    font-size: 12px; letter-spacing: 0.06em;
    opacity: 0; transition: opacity 0.5s ease;
    pointer-events: none;
  }
  #postcard-hint.show { opacity: 1; }

  /* ---- 声音开关（默认关，纸面风格） ---- */
  #sound-btn {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 30;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255, 250, 236, 0.86);
    border: 1.5px solid rgba(120, 88, 56, 0.38);
    color: #6b5442; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(90, 62, 38, 0.14);
    transition: opacity 0.35s ease, transform 0.15s ease, background 0.2s;
  }
  #sound-btn:hover { background: rgba(255, 250, 236, 0.97); }
  #sound-btn:active { transform: translateX(-50%) scale(0.96); }
  /* 关着的时候很淡，开着才明显——不要让访客误以为它有声音 */
  #sound-btn[aria-pressed="false"] { opacity: 0.55; }
  #sound-btn[aria-pressed="true"] {
    background: rgba(255, 236, 178, 0.95);
    border-color: rgba(180, 138, 60, 0.6);
    color: #5a4425;
  }
  #sound-btn[aria-pressed="true"] span[aria-hidden] { animation: sb-pulse 2.4s ease-in-out infinite; }
  @keyframes sb-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { #sound-btn[aria-pressed="true"] span[aria-hidden] { animation: none; } }
  /* 明信片模式与面板打开时收起 */
  body.postcard #sound-btn, body.panel-open #sound-btn { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 手机窄屏：只留音符，省空间 */
  @media (max-width: 560px) { #sound-btn .sb-lab { display: none; } #sound-btn { padding: 7px 11px; } }

  .hidden { opacity: 0 !important; visibility: hidden !important; }

  /* ---------------- 探针面板 / 详情：窄屏适配（统一断点 900 / 700 / 560） ---------------- */
  @media (max-width: 1024px) {
    /* ★3 列断点定在 1024 而不是 900：实测 901~965px 区间三列会把卡片压到 267px，
       而卡片的 min-content 约 276px（网速+流量两段 nowrap 数字）。
       1024 以下是两列，卡片回到 405px+，不会贴着极限跑。 */
    #plist-body { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .chart-grid { grid-template-columns: 1fr; }
    .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    #plist { padding: 10px; }
    #plist .sheet { width: 100%; max-height: 88vh; border-radius: 12px; }
    #plist.is-detail .sheet { max-height: 94vh; }
    #plist header { padding: 13px 14px 11px; }
    #plist-body { grid-template-columns: minmax(0, 1fr); padding: 10px 12px; gap: 8px; }
    #plist-detail { padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 560px) {
    #plist-sum { display: none; }
    #plist h3 { flex: 1 1 auto; min-width: 0; font-size: 15px; }
    #plist-admin { padding: 3px 8px; }
    #plist-admin .pa-txt { display: none; }
    .pgrid { grid-template-columns: 1fr; }
  }

  @media (max-width: 620px) {
    .hud { min-width: 0; padding: 10px 12px; }
    .hud .row { font-size: 11.5px; }
    #dialogue { bottom: 16px; padding: 12px 16px 14px; }
    #dialogue-text { font-size: 13.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud" id="hud">
    <h1>探针小镇</h1>
    <div class="hud-site"></div>
    <div class="row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="dim">/</span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><span>移动</span></div>
    <div class="row"><kbd>E</kbd><span>查看服务器</span><span class="dim">/</span><span>点击小鸡</span></div>
    <div class="row"><kbd>Tab</kbd><span>探针列表</span><span class="dim">/</span><span>点行跳转</span></div>
    <!-- 触屏档的等价说明（键盘提示对手机是噪音，只留这一行） -->
    <div class="row row-touch"><span class="tk">摇杆</span><span>走位</span><span class="dim">/</span><span class="tk">点小鸡</span><span>看数据</span></div>
  </div>

  <div id="probe-bar" class="probe-bar" data-state="empty">
    <span class="probe-status">未发现服务器</span>
    <span class="probe-time"></span>
    <button class="pp-cards" type="button" title="显示 / 隐藏小鸡头顶的服务器卡片" aria-pressed="true">卡片</button>
    <button class="pp-open" type="button" title="探针列表（Tab）">列表</button>
  </div>

  <div id="plist" class="hidden" role="dialog" aria-modal="true" aria-labelledby="plist-title">
    <div class="sheet">
      <header>
        <button id="plist-back" class="hidden" type="button" title="返回列表" aria-label="返回列表">←</button>
        <h3 id="plist-title">🖥 探针列表</h3>
        <span id="plist-sum"></span>
        <a id="plist-admin" href="/admin/" title="管理后台（仅授权网络可访问）">⚙ <span class="pa-txt">后台</span></a>
        <button id="plist-close" type="button" title="关闭（Tab / Esc）" aria-label="关闭">✕</button>
      </header>
      <div id="plist-body"></div>
      <div id="plist-detail" class="hidden"></div>
      <p class="note"><span class="note-kb">点任意一张卡片看这台机器的详情 · Tab 开关本面板 · Esc 关闭</span><span class="note-touch">点任意一张卡片看这台机器的详情 · 点右上角 ✕ 关闭</span></p>
    </div>
  </div>

  <div id="prompt" class="hidden"><span class="key">E</span><span id="prompt-text">和露露聊聊</span></div>
  <div id="postcard-hint">按 P 或点一下画面回到小镇</div>
  <!-- 声音开关：默认关。★浏览器要求 AudioContext 必须在用户手势里创建，
       所以只能靠这个按钮开，不能自动播。 -->
  <button id="sound-btn" type="button" aria-pressed="false" title="声音（默认关）">
    <span aria-hidden="true">♪</span><span class="sb-lab">声音</span>
  </button>
  <div id="toast" class="hidden"></div>

  <!-- 触屏操作：左下虚拟摇杆（拖动走位）+ 右下动作键（附近有东西可互动时才点亮，等同键盘 E）。
       桌面/带触摸板的笔电默认 hidden，由 main.js 按 pointer:coarse 取消。 -->
  <div id="touch" class="hidden" aria-hidden="true">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="t-act" type="button" aria-label="互动"><span class="t-lab">互动</span></button>
    </div>
    <!-- 小地图：竖屏可见的世界宽度只有约 11 个单位（全图 20%），
         别的机器在哪完全看不出来。缩镜头会让字变小，所以给一张可点的小地图。 -->
    <div id="minimap" role="button" tabindex="0" aria-label="小镇地图，点一下走过去">
      <canvas id="minimap-cv" width="200" height="200"></canvas>
      <span class="mm-hint">点地图走过去</span>
    </div>
  </div>

  <div id="dialogue">
    <div id="speaker"></div>
    <div id="dialogue-text"></div>
    <div class="tip">按 E 继续</div>
  </div>

  <div id="notice">
    <h2>本镇公告</h2>
    <div class="body"></div>
    <div class="close">按 E 或 Esc 合上</div>
  </div>

  <div id="loading">
    <div class="ld-stage">
      <canvas id="ld-canvas" width="216" height="128" role="img"
              aria-label="载入中：一只小鸡把木料搬过去，小镇的房子跟着进度一点点建起来"></canvas>
      <p class="ld-tip">小镇正在醒来 …</p>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./boot.js"></script>
</body>
</html>
